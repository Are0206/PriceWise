<div class="delete-wrapper">
  <h2 class="delete-title" id="card-title">¿Borrar «{{ shopping_list.name }}»?</h2>
  {% with count=shopping_list.items.count %}
  <p class="delete-text">Se borrarán la lista y {{ count }} producto{{ count|pluralize }}. Esta acción no se puede deshacer.</p>
  {% endwith %}

  <div class="delete-buttons-div">
    <a href="{% url 'shopping_lists:detail' shopping_list.pk %}" class="btn btn--outline btn-close">Cancelar</a>

    <form method="post" action="{% url 'shopping_lists:delete' shopping_list.pk %}">
      {% csrf_token %}
      <button type="submit" class="btn btn--danger">Borrar</button>
    </form>
  </div>
</div>
