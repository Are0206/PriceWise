<div class="shopping-list-panel-content">

  <div class="shopping-list-header">
    <h1>Mis listas</h1>
    <a href="{% url 'shopping_lists:create' %}">+ Crear lista</a>
  </div>

  <ul class="shopping-list-items">
    {% for shopping_list in shopping_lists %}
    <li>
      <a href="{% url 'shopping_lists:detail' shopping_list.pk %}" class="shopping-list-item">
        {{ shopping_list.name }}
        {% with count=shopping_list.items.count %}
        <span>{{ count }} producto{{ count|pluralize }}</span>
        {% endwith %}
      </a>
    </li>
    {% empty %}
    <li class="empty-state">Aún no tienes listas.</li>
    {% endfor %}
  </ul>

</div>
