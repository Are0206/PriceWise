name: Sync Los Precios

# Manual run: imports today's prices and opens a pull request with the updated
# db.sqlite3, so the team reviews the data change like any other change.
# Needs the repository secret LOSPRECIOS_API_KEY.
on:
  workflow_dispatch:
    inputs:
      max_pages:
        description: "Pages per store and category (empty = all)"
        required: false
        default: ""

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-losprecios
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          ref: develop

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Apply migrations
        run: python manage.py migrate --noinput

      - name: Import from Los Precios
        env:
          LOSPRECIOS_API_KEY: ${{ secrets.LOSPRECIOS_API_KEY }}
          MAX_PAGES: ${{ inputs.max_pages }}
        run: |
          if [ -z "$LOSPRECIOS_API_KEY" ]; then
            echo "::error::Add the LOSPRECIOS_API_KEY repository secret first."
            exit 1
          fi
          python manage.py sync_losprecios ${MAX_PAGES:+--max-pages "$MAX_PAGES"}

      - name: Open a pull request with the new data
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- db.sqlite3; then
            echo "No price changes."
            exit 0
          fi
          branch="chore/sync-losprecios-$(date -u +%Y%m%d-%H%M)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add db.sqlite3
          git commit -m "chore(data): sync Los Precios prices"
          git push origin "$branch"
          gh pr create --base develop --head "$branch" \
            --title "Datos: sincronización de Los Precios $(date -u +%Y-%m-%d)" \
            --body "Precios importados con \`sync_losprecios\` desde GitHub Actions. Revisar el resumen del job antes de mergear."
