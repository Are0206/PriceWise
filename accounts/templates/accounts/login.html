<!DOCTYPE html>
<html>
<head>
  <title>Log in - PriceWise</title>
  <style>
    body {
      font-family: Arial, Helvetica, sans-serif;
      background-color: #f2f2f2;
      margin: 0;
      padding: 0;
    }
    .login-container {
      max-width: 420px;
      margin: 50px auto;
      padding: 30px;
      background-color: #fff;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
    }
    .login-container h1 {
      text-align: center;
      font-size: 24px;
      color: #062925;
      margin-top: 0;
      margin-bottom: 24px;
    }
    .login-form p {
      display: block;
      margin: 0 0 18px 0;
    }
    .login-form label {
      display: block;
      font-size: 14px;
      font-weight: bold;
      color: #000;
      margin-bottom: 5px;
    }
    .login-form input {
      display: block;
      width: 100%;
      padding: 9px;
      box-sizing: border-box;
      font-size: 14px;
      color: #000;
      background-color: #fff;
      border: 1px solid #999;
      border-radius: 4px;
    }
    .login-form button {
      width: 100%;
      padding: 11px;
      font-size: 15px;
      font-weight: bold;
      color: #fff;
      background-color: #062925;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      margin-top: 6px;
    }
    .errorlist {
      list-style: none;
      padding: 0;
      margin: 0 0 8px 0;
      color: #c00;
      font-size: 13px;
    }
    .back-link {
      display: block;
      text-align: center;
      margin-top: 18px;
      font-size: 14px;
      color: #062925;
    }
  </style>
</head>
<body>
  <div class="login-container">
    <h1>Log in to PriceWise</h1>

    <form method="post" class="login-form">
      {% csrf_token %}
      {{ form.non_field_errors }}

      <p>
        <label for="{{ form.username.id_for_label }}">Username</label>
        {{ form.username.errors }}
        {{ form.username }}
      </p>

      <p>
        <label for="{{ form.password.id_for_label }}">Password</label>
        {{ form.password.errors }}
        {{ form.password }}
      </p>

      <button type="submit">Log in</button>
    </form>

    <a href="/" class="back-link">Back to PriceWise</a>
  </div>
</body>
</html>
