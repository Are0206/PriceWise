<!DOCTYPE html>
<html>

<head>
  <title>PriceWise</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lobster+Two:ital,wght@0,400;0,700;1,400;1,700&display=swap"
    rel="stylesheet">
  {% load static %}

  <link rel="stylesheet" href="{% static 'css/header.css' %}">
  <link rel="stylesheet" href="{% static 'css/body.css' %}">
  <link rel="stylesheet" href="{% static 'css/general.css' %}">
  <link rel="stylesheet" href="{% static 'css/list_panel.css' %}">

  <script>
    const shoppingListsUrl = "{% url 'shopping_lists:index' %}";
  </script>

  <script src="{% static 'js/shopping-list-panel.js' %}" defer>
  </script>
</head>

<body>

  <div class="main-page">
    <div class="header">
      <div class="left-header">
        <a href="{% url 'home' %}">
          <p class="app-icon">PriceWise</p>
        </a>
      </div>

      <div class="middle-header">
        <form action="" method="get">
          <div class="search-container">

            <select class="search-by-selector" name="search_by">
              <option class="search-by-selector" value="product" {% if search_by == 'product' %}selected{% endif %}>
                Producto
              </option>
              <option class="search-by-selector" value="supermarket" {% if search_by == 'supermarket' %}selected{% endif %}>
                Supermercado
              </option>
            </select>

            <input type="text" name="q" class="search-bar" placeholder="Search product" value="{{ request.GET.q }}">

            <button type="submit" class="search-button">
              <div class="search-button-div">
                <img class="search-icon" src="{% static 'img/icons/search.png'%}">
              </div>
            </button>

          </div>
        </form>

      </div>

      <div class="right-header">
        <button class="shopping-list-anchor" id="shoppingListButton" type="button">
          <div class="shopping-list-container">
            <img class="shopping-list-icon" src="{% static 'img/icons/lists.png'%}">
            <p class="shopping-list-text">Shopping Lists</p>

          </div>
        </button>
      </div>


    </div>

    <div class="page-body">

      <div class="filter-section">
        <h1 style="color: black; font-size:20px; text-align: center;">Filter</h1>
        <form action="{% url 'home' %}" method="get" id="categoryFilterForm">
          <select class="search-by-selector" name="category" onchange="document.getElementById('categoryFilterForm').submit();">
            <option value="">-- Category --</option>
            {% for category in categories %}
            <option value="{{ category.slug }}" {% if category_filter == category.slug %}selected{% endif %}>{{ category.name }}</option>
            {% endfor %}
          </select>
        </form>
      </div>

      <div class="product-section">
        <div class="products-grid">

          {% for product in products %}

          <div class="product-card">

            {% if product.image %}
            <img class="product-image" src="{{ product.image.url }}" alt="{{ product.name }}">
            {% endif %}

            <div class="product-details">
              <p class="product-name">{{ product.name }}</p>

              <a href="{% url 'products:detail' product.pk %}">
                <button>View Details</button>
              </a>
            </div>
          </div>

          {% empty %}

          <p>No products available.</p>

          {% endfor %}

        </div>
      </div>

    </div>
  </div>


  <div id="shoppingListPanel" class="shopping-list-panel">

    <button id="closeShoppingList" class="close-panel" type="button">
      ×
    </button>

    <div id="shoppingListContent"></div>

  </div>

</body>

</html>
