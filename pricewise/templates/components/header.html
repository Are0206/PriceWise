{% load static %}
<header class="header">
  <div class="left-header">
    <a href="{% url 'index' %}">
      <img src="{% static 'img/icons/pricewise-icon.png' %}" class="pricewise-icon" alt="PriceWise, inicio" width="640" height="149">
    </a>
  </div>

  <div class="middle-header">
    <form action="{% url 'index' %}" method="get">

      <!-- Carry the active filters so searching does not clear them -->
      <input type="hidden" name="category" value="{{ category_filter }}">
      <input type="hidden" name="min_price" value="{{ min_price }}">
      <input type="hidden" name="max_price" value="{{ max_price }}">
      <input type="hidden" name="sort" value="{{ sort }}">

      <div class="search-container">

        <select class="search-by-selector" name="search_by" aria-label="Buscar por">
          <option class="search-by-selector" value="product" {% if search_by == 'product' %}selected{% endif %}>
            Por producto
          </option>
          <option class="search-by-selector" value="supermarket" {% if search_by == 'supermarket' %}selected{% endif %}>
            Por supermercado
          </option>
        </select>

        <input type="search" name="q" class="search-bar" placeholder="{% if search_by == 'supermarket' %}Productos de un supermercado, ej. D1{% else %}Buscar producto{% endif %}" aria-label="Texto a buscar" value="{{ query }}">

        <button type="submit" class="search-button" aria-label="Buscar">
          <div class="search-button-div">
            <img class="search-icon" src="{% static 'img/icons/search.png' %}" alt="" width="66" height="66">
          </div>
        </button>

      </div>
    </form>

  </div>

  <nav class="right-header" aria-label="Cuenta y secciones">
    <span class="user-area">
      {% if user.is_authenticated %}
      <span class="greeting">Hola, {{ user.username }}</span>
      <a href="{% url 'products:supermarkets_index' %}">Supermercados</a>
      <a href="{% url 'products:favorites' %}">Favoritos{% if favorite_drop_count %} <span class="drop-badge" aria-label="{{ favorite_drop_count }} bajaron de precio">{{ favorite_drop_count }}</span>{% endif %}</a>
      <button class="shopping-list-button" id="shoppingListButton" type="button" aria-expanded="false" aria-controls="shoppingListPanel">
        Listas
      </button>
      <a href="{% url 'accounts:change_password' %}">Contraseña</a>
      <form action="{% url 'accounts:logout' %}" method="post">
        {% csrf_token %}
        <button type="submit" class="log-out-button">Cerrar sesión</button>
      </form>
      {% else %}
      <div class="user-area-div">
        <a href="{% url 'products:supermarkets_index' %}">Supermercados</a>
        <a href="{% url 'accounts:login' %}?next={{ request.get_full_path|urlencode }}">Iniciar sesión</a>
        <a href="{% url 'accounts:register' %}">Registrarse</a>
      </div>
      {% endif %}
    </span>

  </nav>
</header>
