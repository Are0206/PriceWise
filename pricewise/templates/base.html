{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}PriceWise{% endblock %}</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&display=swap" rel="stylesheet">

    <!-- css -->
    <link rel="stylesheet" href="{% static 'css/components/header.css' %}">
    <link rel="stylesheet" href="{% static 'css/base.css' %}">
    <link rel="stylesheet" href="{% static 'css/index/list_panel.css' %}">
    {% block extra_css %}{% endblock %}
</head>
<body>

    {% include "components/header.html" %}

    <main>
        {% block content %}
        {% endblock %}
    </main>

    <div id="shoppingListPanel" class="shopping-list-panel">
      <button id="closeShoppingList" class="close-panel" type="button">
        ×
      </button>
      <div id="shoppingListContent"></div>
    </div>

    <script>
      const shoppingListsUrl = "{% url 'shopping_lists:index' %}";
    </script>

    <script src="{% static 'js/shopping-list-panel.js' %}" defer>
    </script>
</body>
</html>
