{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}PriceWise{% endblock %}</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&display=swap" rel="stylesheet">

    <!-- css -->
    <link rel="stylesheet" href="{% static 'css/components/header.css' %}">
    <link rel="stylesheet" href="{% static 'css/base.css' %}">
    <link rel="stylesheet" href="{% static 'css/index/list_panel.css' %}">
    {% block extra_css %}{% endblock %}
</head>
<body>

    {% include "components/header.html" %}

    <main>
        {% if messages %}
        <ul class="messages" role="status">
          {% for message in messages %}
          <li class="message{% if message.tags == 'error' %} message--error{% endif %}">{{ message }}</li>
          {% endfor %}
        </ul>
        {% endif %}

        {% block content %}
        {% endblock %}
    </main>

    <div id="shoppingListPanel" class="shopping-list-panel">
      <button id="closeShoppingList" class="close-panel" type="button" aria-label="Cerrar listas">
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
      <div id="shoppingListContent"></div>
    </div>

    <script>
      const shoppingListsUrl = "{% url 'shopping_lists:index' %}";
    </script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/gsap.min.js" integrity="sha384-HOvlOYPIs/zjoIkWUGXkVmXsjr8GuZLV+Q+rcPwmJOVZVpvTSXQChiN4t9Euv9Vc" crossorigin="anonymous" defer></script>
    <script src="{% static 'js/shopping-list-panel.js' %}" defer>
    </script>
    <script src="{% static 'js/motion.js' %}" defer></script>
</body>
</html>
